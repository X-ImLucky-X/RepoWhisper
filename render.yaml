services:
  - type: web
    name: repowhisper-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: "postgresql://user:password@host:port/dbname"
      - key: QDRANT_URL
        value: ""
      - key: GOOGLE_API_KEY
        value: ""
      - key: GROQ_API_KEY
        value: ""
  - type: web
    name: repowhisper-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://repowhisper-backend.onrender.com
